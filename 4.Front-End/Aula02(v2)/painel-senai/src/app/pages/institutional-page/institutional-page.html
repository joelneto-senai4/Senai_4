<section class="subpage" aria-labelledby="page-title">
  <div class="subpage-heading">
    <span class="section-kicker">{{ page.kicker }}</span>
    <h1 id="page-title">{{ page.title }}</h1>
    <p>{{ page.intro }}</p>
    @if (page.actionLabel && page.actionLink) { <a class="subpage-action" [routerLink]="page.actionLink">{{ page.actionLabel }}</a> }
  </div>
  <div class="subpage-grid">
    @for (card of page.cards; track card.title) {
      <article class="subpage-card">
        @if (card.label) { <span class="tag">{{ card.label }}</span> }
        <h2>{{ card.title }}</h2>
        <p>{{ card.text }}</p>
        <span class="subpage-mark" aria-hidden="true"></span>
      </article>
    }
  </div>
</section>
