<article class="card">
	<img [src]="image()" [alt]="title()" />
	<div class="card-content">
		<span class="card-category">{{ category() }}</span>
		<h2>{{ title() }}</h2>
		<p>{{ description() }}</p>
	</div>
	<a class="card-link" routerLink="/cursos">Ver curso <svg class="link-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6" /></svg></a>
</article>
